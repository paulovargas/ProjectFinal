<template>
    <lightning-quick-action-panel class="slds-text-heading_medium slds-m-bottom_small" header="New Account with CNPJ">
        <div class="slds-p-around_medium slds-align_absolute-center">
            <!-- Altere o botão para abrir explicitamente o modal de CNPJ, evitando conflito com o handler legado -->
            <lightning-button label="Search CNPJ" variant="brand" onclick={openCnpjSearchModal}></lightning-button>
        </div>

        <!-- Modal: Buscar por CNPJ (aberto automaticamente ao acessar) -->
        <template if:true={showCnpjSearchModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-02" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="modal-heading-02" class="slds-text-heading_medium">Search CNPJ</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            name="cnpjModal"
                            label="CNPJ"
                            value={cnpjModalValue}
                            onchange={handleCnpjModalInput}
                            message-when-bad-input="Informe um CNPJ válido"
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeCnpjSearchModal}></lightning-button>
                        <lightning-button class="slds-m-left_small" variant="brand" label="Search" onclick={handleCnpjModalSearch}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Modal: Registro encontrado (oferece Editar) -->
        <template if:true={showFoundModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-found" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="modal-heading-found" class="slds-text-heading_medium">Registro já cadastrado</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>Já existe uma conta com este CNPJ.</p>
                        <template if:true={foundRecordId}>
                            <p class="slds-m-top_small">CNPJ: {cnpjExist}</p>
                            <p class="slds-m-top_small">Name: {nameExist}</p>
                        </template>
                        <p class="slds-m-top_small">Deseja abrir este registro para edição?</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                        <lightning-button class="slds-m-left_small" variant="brand" label="Edit" onclick={handleEditRecord}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-quick-action-panel>
</template>
